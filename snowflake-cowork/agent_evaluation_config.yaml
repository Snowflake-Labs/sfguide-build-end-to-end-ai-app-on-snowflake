# Uses the HOL_EVAL_DATASET dataset created by setup.sql (no dataset: block, so
# repeated runs don't try to re-create it).
evaluation:
  agent_params:
    agent_name: "DASH_AUTOMATED_INTELLIGENCE_DB.SEMANTIC.BUSINESS_INSIGHTS_AGENT"
    agent_type: "CORTEX AGENT"
  run_params:
    label: "HOL Agent Evaluation"
    description: "Evaluate Business Insights Agent with answer correctness and logical consistency"
  source_metadata:
    type: "dataset"
    dataset_name: "HOL_EVAL_DATASET"

# Pin v3: the v1 default judge (claude-4-sonnet) is legacy as of Aug 12, 2026,
# so accounts with no prior usage of it can't run unversioned metrics.
metrics:
  - name: "answer_correctness"
    version: "v3"
  - name: "logical_consistency"
    version: "v3"
